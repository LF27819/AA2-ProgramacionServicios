services:
  db:
    image: postgres:15
    container_name: postgres-db

    environment:
      POSTGRES_USER: discord_user
      POSTGRES_PASSWORD: discord_password
      POSTGRES_DB: discord_db
    ports:
      - '5432:5432'

  app:
    build: .
    container_name: nest-app
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: discord_user
      DB_PASSWORD: discord_password
      DB_DATABASE: discord_db
      JWT_SECRET: secreto